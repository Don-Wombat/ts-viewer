name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: PHP Syntax-Check
        run: |
          for f in html/index.php html/config.php html/lib/*.php bin/*.php; do
            php -l "$f"
          done
      - name: Protokoll-Selbsttest
        run: php bin/selftest_parser.php
      - name: Transport-Integrationstest (gegen Mock-ServerQuery-Socket)
        run: php bin/test_raw_transport.php

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker Image bauen
        run: docker build -t ts-viewer:ci .
      - name: App-Dateien im Image pruefen
        # Faengt genau die Bug-Klasse "Dockerfile baut erfolgreich, kopiert die
        # App aber nicht ins Image" - ein reiner "docker build"-Erfolg allein
        # haette das nicht erkannt.
        run: docker run --rm ts-viewer:ci test -f /var/www/html/index.php
      - name: Container starten und HTTP-Smoke-Test
        run: |
          docker run -d --name ts-viewer-ci -p 8080:80 ts-viewer:ci
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /tmp/body.html -w "%{http_code}" http://127.0.0.1:8080/ || true)
            [ "$STATUS" = "200" ] && break
            sleep 1
          done
          echo "HTTP status: $STATUS"
          cat /tmp/body.html
          docker logs ts-viewer-ci
          docker rm -f ts-viewer-ci
          [ "$STATUS" = "200" ]
          grep -q "nicht konfiguriert" /tmp/body.html
      - name: Health-Endpoint pruefen
        run: |
          docker run -d --name ts-viewer-ci-health -p 8081:80 ts-viewer:ci
          for i in $(seq 1 10); do
            BODY=$(curl -s http://127.0.0.1:8081/?health=1 || true)
            [ "$BODY" = "ok" ] && break
            sleep 1
          done
          docker logs ts-viewer-ci-health
          docker rm -f ts-viewer-ci-health
          [ "$BODY" = "ok" ]
