name: Publish Docker image

# Builds and publishes the image to ghcr.io on every version tag (v0.1.6,
# v0.1.6.2, ...), plus it can be triggered manually (workflow_dispatch) for
# tags that already existed before this workflow.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v0.1.6.2)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # Untrusted-ish input (workflow_dispatch is user-supplied) goes through
      # env: instead of being spliced directly into the run: script via
      # ${{ }} - avoids the classic GitHub Actions script-injection pattern.
      - name: Determine tag and lowercase repo name (ghcr.io requires lowercase)
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.name }}:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ steps.vars.outputs.name }}:latest
