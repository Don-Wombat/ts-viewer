name: Publish Docker image

# Baut und veroeffentlicht das Image auf ghcr.io bei jedem Versions-Tag
# (v0.1.6, v0.1.6.2, ...), plus manuell auslösbar (workflow_dispatch) fuer
# Tags, die schon vor diesem Workflow existierten.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git-Tag, das gepublished werden soll (z.B. v0.1.6.2)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Repo-Namen in Kleinbuchstaben (ghcr.io verlangt lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tag-Namen ermitteln
        id: tagname
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Login bei ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tagname.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
