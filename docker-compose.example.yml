services:
  ts-viewer:
    # Builds directly from the tagged release so the build is reproducible
    # against a specific version. To use a different state, either change
    # the tag or switch to "build: ." to build from a local checkout.
    build:
      context: https://github.com/Don-Wombat/ts-viewer.git#v0.1.7
    image: ts-viewer:v0.1.7
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - ts-viewer-cache:/var/cache/ts-viewer

volumes:
  ts-viewer-cache:
